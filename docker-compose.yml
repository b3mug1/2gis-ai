services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cityguide
      POSTGRES_USER: cityguide
      POSTGRES_PASSWORD: cityguide
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityguide -d cityguide"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      UVICORN_RELOAD: "1"
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./alembic
          target: /app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./2gis-frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_TWOGIS_API_KEY=${TWOGIS_API_KEY:-}
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_TWOGIS_API_KEY=${TWOGIS_API_KEY:-}
      - CHOKIDAR_USEPOLLING=true
      - PORT=7000
    volumes:
      - ./2gis-frontend:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./2gis-frontend/src
          target: /app/src
    env_file:
      - ./2gis-frontend/.env.local
    depends_on:
      api:
        condition: service_started
    ports:
      - "7000:7000"
    tty: true
    stdin_open: true

